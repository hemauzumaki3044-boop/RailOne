<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>RailOne</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
    }

    /* Full-screen layer: fixed inset-0, 100vw x 100dvh, white, centered, no borders */
    .splash-root {
      position: fixed;
      inset: 0;
      z-index: 50;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 0;
      overflow: hidden;
      animation: splash-fade-in 150ms linear 0ms both;
    }

    .splash-logo {
      width: 45vw;
      max-width: 180px;
      height: auto;
      object-fit: contain;
      will-change: transform;
      backface-visibility: hidden;
      transform: translateZ(0);
      /* Timeline (total 2400ms):
         0-150ms     screen fades in
         0-1200ms    logo shrinks scale(2.0) -> scale(1.0)
         1200-2400ms logo holds still at scale(1.0) */
      animation: splash-shrink 1200ms cubic-bezier(0.25, 0.1, 0.25, 1) 0ms both;
    }

    @keyframes splash-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes splash-shrink {
      from { transform: scale(2); }
      to   { transform: scale(1); }
    }

    /* Placeholder next screen, for preview only */
    .next-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #FFFFFF;
      align-items: center;
      justify-content: center;
      color: #6B7280;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
