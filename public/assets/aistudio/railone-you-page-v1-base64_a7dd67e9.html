<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E2F9FF" />
  <title>RailOne - You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #E5E7EB; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    .app {
      position: relative; min-height: 100vh; min-height: 100dvh;
      max-width: 430px; margin: 0 auto; background: #FFFFFF;
      padding-bottom: 80px; overflow-x: hidden;
    }
    .abs { position: absolute; }
    .btn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; }

    /* ---------- Top profile block ---------- */
    .top {
      position: relative; height: 368px;
      background: #E2F9FF; border-radius: 0 0 60px 60px;
    }
    .back { left: 14.5px; top: 56.5px; width: 48px; height: 48px; }
    .avatar { left: 50%; top: 123.75px; transform: translateX(-50%); width: 80.5px; height: 80.5px; }
    .name {
      left: 0; right: 0; top: 212px; text-align: center; margin: 0;
      font-size: 17.0px; line-height: 24px; font-weight: 700; color: #000000; white-space: nowrap;
    }
    .links {
      left: 0; right: 0; top: 236px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15.0px; font-weight: 500; color: #0166FF; white-space: nowrap;
    }
    .links .eye { width: 15px; height: 12px; margin-right: 3px; }
    .links .pencil { width: 13.5px; height: 14px; margin-right: 3px; }
    .links .sep { color: #8A8F98; margin: 0 17px; font-weight: 400; }

    .wallet {
      left: 32px; top: 284px; width: 296px; height: 62px;
      background: #FFFFFF; border-radius: 31px;
    }
    .wallet > * { position: absolute; }
    .w-icon { left: 13px; top: 17.75px; width: 30.5px; height: 26.5px; }
    .w-lbl { left: 53px; top: 12px; font-size: 11.5px; line-height: 16px; font-weight: 500; color: #000000; white-space: nowrap; }
    .w-bal { left: 53px; top: 27px; font-size: 17.0px; line-height: 20px; font-weight: 700; color: #015F47; white-space: nowrap; }
    .w-refresh { left: 190px; top: 19px; width: 18.5px; height: 24px; }
    .w-add {
      left: 220.5px; top: 15.5px; width: 62px; height: 31px; border-radius: 16px;
      background: #0166FF; color: #FFFFFF; font-size: 11.0px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- Profile complete ---------- */
    .profile {
      position: absolute; left: 21.5px; top: 380px; width: 317px; height: 86px;
      background: #FFFFFF; border: 2px solid #D7F1FB; border-radius: 16px;
    }
    .profile > * { position: absolute; }
    .p-title { left: 10px; top: 9px; font-size: 14.5px; line-height: 18px; font-weight: 500; color: #000000; white-space: nowrap; margin: 0; }
    .p-bar { left: 9.5px; top: 48px; width: 252px; height: 5px; border-radius: 3px; background: #3A8F3A; }
    .p-pct {
      right: 10px; top: 28px; text-align: right; white-space: pre;
      font-size: 16.5px; line-height: 25px; font-weight: 700; color: #000000; margin: 0;
    }

    /* ---------- Saved passengers ---------- */
    .saved {
      position: absolute; left: 18.5px; top: 487.5px; width: 323px; height: 64px;
      background: #FFF1E4; border-radius: 20px;
    }
    .saved > * { position: absolute; }
    .s-icon { left: 16.5px; top: 22px; width: 31px; height: 20px; }
    .s-title { left: 57px; top: 14px; font-size: 13.0px; line-height: 16px; font-weight: 500; color: #1A1A1A; white-space: nowrap; margin: 0; }
    .s-sub { left: 57px; top: 33px; font-size: 11.0px; line-height: 14px; font-weight: 400; color: #1A1A1A; white-space: nowrap; margin: 0; }
    .s-refresh { left: 214.5px; top: 20px; width: 17px; height: 24px; }
    .s-add {
      left: 245.5px; top: 8.5px; width: 62px; height: 47px; border-radius: 24px;
      background: #FABD53; color: #8C5A01; font-size: 11.0px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- Menu tiles (positions measured from the screenshot) ---------- */
    .tile {
      position: absolute; width: 100.5px; border-radius: 16px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; color: #0C234D;
    }
    .tile .t-icon { display: block; margin: 0 auto; }
    .tile .t-label {
      width: 60px; margin: 0; font-size: 12.5px; line-height: 19px; font-weight: 600;
      overflow-wrap: break-word; word-break: normal;
    }
    .t-change   { left: 18.5px;  top: 400px;   height: 116px; background: #E2F9FF; }
    .t-account  { left: 130px;   top: 400px;   height: 100px; background: #E9FFE8; }
    .t-bio      { left: 241.5px; top: 400px;   height: 117px; background: #FFF6FB; }
    .t-transfer { left: 18.5px;  top: 528.5px; height: 100.5px; background: #F0F8FB; }
    .t-txn      { left: 130px;   top: 528.5px; height: 99.5px; background: #FFF1E4; }
    .t-aadhar   { left: 241.5px; top: 528.5px; height: 117.5px; background: #F0F1EC; }

    .t-change .t-icon   { margin-top: 16px; width: 30.5px; height: 31px; }
    .t-change .t-label  { margin-top: 5px; }
    .t-account .t-icon  { margin-top: 16px; width: 31.5px; height: 29.5px; }
    .t-account .t-label { margin-top: 8px; }
    .t-transfer .t-icon { margin-top: 15.5px; width: 31px; height: 25.5px; }
    .t-transfer .t-label{ margin-top: 8px; }
    .t-txn .t-icon      { margin-top: 14px; width: 27px; height: 31px; }
    .t-txn .t-label     { margin-top: 8px; }
    .t-aadhar .t-icon   { margin-top: 14.5px; width: 32px; height: 29.5px; }
    .t-aadhar .t-label  { margin-top: 9px; }

    .switch {
      position: relative; display: block; margin: 28.5px auto 0; width: 51px; height: 21px;
      border: 1.5px solid #0066FF; border-radius: 11px; background: #FFFFFF;
      cursor: pointer; padding: 0;
    }
    .switch .on-txt {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      font-size: 10.5px; font-weight: 600; color: #0066FF; line-height: 12px;
    }
    .switch .knob {
      position: absolute; right: 1px; top: 1px; width: 17.5px; height: 17.5px;
      border-radius: 50%; background: #0066FF; transition: transform 200ms ease;
    }
    .switch[aria-checked="false"] .knob { transform: translateX(-27px); background: #B9BEC6; }
    .switch[aria-checked="false"] { border-color: #B9BEC6; }
    .switch[aria-checked="false"] .on-txt { opacity: 0; }
    .t-bio .t-label { margin-top: 10px; }

    /* ---------- Bottom navigation ---------- */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 58px; z-index: 20;
      background: #0166FF; display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .nav-item {
      all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; color: rgba(255, 255, 255, 0.78); font-size: 11.0px; font-weight: 500;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.active { color: #FFFFFF; }

    /* ---------- Loader (same ring as the dashboard) ---------- */
    .loader {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(20, 24, 32, 0.38); z-index: 100;
    }
    .loader.show { display: flex; }
    .loader img { display: block; width: 64px; height: 64px; animation: loader-spin 0.9s linear infinite; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<script>
  // ---- Callback hook: replace with your own navigation / logic ----
  function onAction(name, data) {}

  function act(name, data) {
    const loader = document.getElementById('loader');
    loader.classList.add('show');
    setTimeout(() => { loader.classList.remove('show'); onAction(name, data); }, 1200);
  }

  function toggleBio() {
    const sw = document.getElementById('bioSwitch');
    const enabled = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(enabled));
    onAction('biometric', enabled);
  }
