<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EFEEFE" />
  <title>RailOne - Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #E5E7EB; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    .app {
      position: relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
      margin: 0 auto; background: #FFFFFF; overflow: hidden;
    }

    /* ---------- Page behind the drawer (placeholder) ---------- */
    .page-title { position: absolute; left: 21px; top: 52px; margin: 0; font-size: 13px; font-weight: 600; color: #10236B; }
    .page-nav-hint { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 12px; color: #9CA3AF; }

    .bottom-nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: 58px; z-index: 30;
      background: #0166FF; display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .nav-item {
      all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; color: rgba(255, 255, 255, 0.78); font-size: 11px; font-weight: 500;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.active { color: #FFFFFF; }

    /* ---------- Overlay ---------- */
    .overlay {
      position: absolute; inset: 0; z-index: 40; background: rgba(20,24,32,0.42);
      opacity: 0; pointer-events: none; transition: opacity 280ms ease;
    }
    .app.open .overlay { opacity: 1; pointer-events: auto; }

    /* ---------- Drawer ---------- */
    .drawer {
      position: absolute; top: 0; bottom: 0; right: 0; width: 313.5px; z-index: 50;
      background: #FFFFFF; border-radius: 0 20px 20px 0; overflow: hidden;
      transform: translateX(100%); transition: transform 280ms ease;
    }
    .app.open .drawer { transform: translateX(0); }

    .d-top { position: relative; height: 214px; background: #EFEEFE; }
    .d-avatar { position: absolute; left: 50%; top: 72.5px; transform: translateX(-50%); width: 81px; height: 81px; }
    .d-name {
      position: absolute; left: 0; right: 0; top: 171px; margin: 0; text-align: center;
      font-size: 17.0px; line-height: 22px; font-weight: 700; color: #000000; white-space: nowrap;
    }

    .d-wallet {
      position: absolute; left: 0; top: 245px; width: 313.5px; height: 74px;
      background: #EFEEFE; border-radius: 37px 0 0 37px;
    }
    .d-wallet > * { position: absolute; }
    .w-ico { left: 11px; top: 24px; width: 30.5px; height: 26.5px; }
    .w-lbl { left: 52px; top: 17px; margin: 0; font-size: 12.5px; line-height: 16px; font-weight: 500; color: #000000; white-space: nowrap; }
    .w-bal { left: 52px; top: 31px; margin: 0; font-size: 17.0px; line-height: 20px; font-weight: 700; color: #000000; white-space: nowrap; }
    .w-add {
      left: 198px; top: 14px; width: 104px; height: 47px; border: 0; border-radius: 24px; cursor: pointer;
      background: #0166FF; color: #FFFFFF; font-size: 14.5px; font-weight: 600;
    }

    .menu { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
    .row {
      position: absolute; left: 0; right: 0; height: 42px; margin-top: -21px;
      background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
    }
    .row .ico { position: absolute; left: 15.5px; top: 50%; transform: translateY(-50%); }
    .row .lbl {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 15.0px; font-weight: 500; color: #000000; white-space: nowrap;
    }
    .d-line { position: absolute; left: 15.5px; width: 282.5px; top: 661px; height: 1px; background: #C9C9E5; }
    .logout {
      position: absolute; left: 0; right: 0; top: 668px; height: 40px; margin: 0;
      background: none; border: 0; padding: 0; cursor: pointer;
    }
    .logout .ico { position: absolute; left: 15.5px; top: 50%; transform: translateY(-50%); width: 21.5px; height: 23.5px; }
    .logout .lbl {
      position: absolute; left: 48.5px; top: 50%; transform: translateY(-50%);
      font-size: 14.5px; font-weight: 500; color: #000000;
    }
    .d-ver {
      position: absolute; left: 0; right: 0; top: 716px; margin: 0; text-align: center;
      font-size: 13.0px; line-height: 16px; color: #9D9D9D;
    }

    /* ---------- Loader (same ring as the dashboard) ---------- */
    .loader {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(20, 24, 32, 0.38); z-index: 100;
    }
    .loader.show { display: flex; }
    .loader img { display: block; width: 64px; height: 64px; animation: loader-spin 0.9s linear infinite; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<script>
  // ---- Callback hook: replace with your own navigation / logic ----
  function onAction(name, data) {}

  function openMenu() { document.getElementById('app').classList.add('open'); }
  function closeMenu() { document.getElementById('app').classList.remove('open'); }

  function act(name, data) {
    const loader = document.getElementById('loader');
    loader.classList.add('show');
    setTimeout(() => {
      loader.classList.remove('show');
      if (name === 'log-out') closeMenu();
      onAction(name, data);
    }, 1200);
  }
</script>
