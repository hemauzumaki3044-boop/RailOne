<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>RailOne - Unreserved E-Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #E5E7EB; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    .app {
      position: relative; width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh;
      margin: 0 auto; background: #F5F5F5; overflow: hidden;
    }

    /* ---------- Header ---------- */
    .header { position: relative; height: 94px; background: #FFFFFF; }
    .title {
      position: absolute; left: 0; right: 0; top: 52px; margin: 0; text-align: center;
      font-size: 19.0px; line-height: 26px; font-weight: 700; color: #182140; white-space: nowrap;
    }
    .close {
      position: absolute; left: 313px; top: 46.5px; width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid #CFEAF7; background: #FFFFFF; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- Card ---------- */
    .card {
      position: relative; margin: 16.5px auto 0; width: 339px; height: 472px;
      background: #FFFFFF; border-radius: 26px;
    }
    .card > * { position: absolute; }

    .seg {
      left: 16px; top: 26px; width: 307px; height: 48px; padding: 3px; border-radius: 14px;
      background: #EEEEEE; display: flex; gap: 0;
    }
    .seg button {
      flex: 1; height: 42px; border: 0; border-radius: 12px; cursor: pointer; padding: 0;
      background: #EBEBEB; color: #000000; font-size: 13.5px; font-weight: 600;
    }
    .seg button.on { background: #FFFFFF; color: #0166FF; }

    .stations { left: 16px; top: 95px; width: 323px; height: 43px; display: flex; gap: 6px; }
    .stations button {
      flex: 1; height: 43px; border-radius: 22px; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1.5px solid #D5D5D5; background: #FFFFFF; color: #7C7D81;
      font-size: 13.0px; font-weight: 500;
    }
    .stations button.on { background: #0166FF; border-color: #0166FF; color: #FFFFFF; font-size: 13.0px; font-weight: 600; }
    .stations img { display: block; }

    .lbl {
      left: 16px; margin: 0; font-size: 14.5px; line-height: 18px; font-weight: 600; color: #0B97E6;
    }
    .lbl-from { top: 170px; }
    .lbl-to { top: 242px; }

    .row { left: 16px; width: 307px; height: 30px; display: flex; align-items: center; }
    .row-from { top: 196px; }
    .row-to { top: 262px; }
    .row img { display: block; flex-shrink: 0; }
    .row input {
      flex: 1; min-width: 0; height: 30px; margin-left: 9px; padding: 0; border: 0; outline: none; background: transparent;
      font-size: 15.0px; font-weight: 500; color: #222222; font-family: inherit;
    }
    .row input::placeholder { color: #FFFFFF; opacity: 1; }

    .sep { left: 8.5px; top: 233px; width: 274px; height: 1px; background: #DCDCDC; }

    .swap {
      left: 282px; top: 212.5px; width: 41px; height: 41px; border-radius: 50%;
      border: 0; cursor: pointer; padding: 0; background: #C0DAFF;
      display: flex; align-items: center; justify-content: center;
    }

    .btn {
      left: 16px; width: 307px; height: 50px; border-radius: 25px; cursor: pointer; padding: 0;
      font-size: 16.5px; font-weight: 600;
    }
    .btn-primary { top: 329.5px; background: #0166FF; border: 0; color: #FFFFFF; }
    .btn-secondary {
      top: 390.5px; height: 49.5px; background: #FFFFFF; border: 1.5px solid #1962D1;
      color: #0065FF; font-size: 16.5px;
    }

    /* ---------- Loader (same ring as the dashboard) ---------- */
    .loader {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(20, 24, 32, 0.38); z-index: 100;
    }
    .loader.show { display: flex; }
    .loader img { display: block; width: 64px; height: 64px; animation: loader-spin 0.9s linear infinite; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1 class="title">Unreserved E-Ticket</h1>
    <button class="close" aria-label="Close" onclick="act('close')">
      <svg width="16" height="16" viewBox="0 0 16 16" stroke="#0166FF" stroke-width="2" stroke-linecap="round"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
  </header>

  <main class="card">
    <div class="seg" role="tablist">
      <button class="on" id="segNormal" onclick="setSeg('normal')">Normal</button>
      <button id="segSeason" onclick="setSeg('season')">Season</button>
    </div>

<script>
  // ---- Callback hook: replace with your own navigation / logic ----
  function onAction(name, data) {}

  let ticketType = 'normal';
  let station = 'outside';

  function setSeg(type) {
    ticketType = type;
    document.getElementById('segNormal').classList.toggle('on', type === 'normal');
    document.getElementById('segSeason').classList.toggle('on', type === 'season');
  }

  function setStation(type) {
    station = type;
    document.getElementById('stOutside').classList.toggle('on', type === 'outside');
    document.getElementById('stAt').classList.toggle('on', type === 'at');
  }

  function swapStations() {
    const from = document.getElementById('fromInput');
    const to = document.getElementById('toInput');
    const tmp = from.value; from.value = to.value; to.value = tmp;
  }

  function proceed() {
    act('proceed-to-book', {
      from: document.getElementById('fromInput').value.trim(),
      to: document.getElementById('toInput').value.trim(),
      ticketType, station
    });
  }

  function act(name, data) {
    const loader = document.getElementById('loader');
    loader.classList.add('show');
    setTimeout(() => { loader.classList.remove('show'); onAction(name, data); }, 1200);
  }
</script>
